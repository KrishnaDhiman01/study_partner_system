{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block head_extra %}
<style>
    .admin-login-container {
        max-width: 450px;
        margin: 4rem auto;
        padding: 2.5rem;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        border: 1px solid #e0e6ed;
    }
    .admin-login-container h1 {
        text-align: center;
        margin-bottom: 2rem;
        color: #333;
    }
    .admin-login-container .form-group-default label {
        font-weight: 500;
    }
    .admin-login-container .btn-primary-default {
        padding: 10px 15px;
        font-size: 1.05rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="admin-login-container">
    <h1>Administrator Login</h1>

    <form method="POST" action="{{ url_for('admin.admin_login', next=request.args.get('next')) }}">
        <div class="form-group-default">
            <label for="username">Admin Username</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="form-group-default">
            <label for="password">Admin Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn-default btn-primary-default btn-full-width">Login as Admin</button>
    </form>
    <p style="text-align:center; margin-top: 1.5rem;">
        <a href="{{ url_for('main.index') }}">Back to Main Site</a>
    </p>
</div>
{% endblock %}
