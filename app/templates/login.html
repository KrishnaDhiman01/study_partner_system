<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Study Partner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    
    <script src="https://kit.fontawesome.com/29aac9abac.js" crossorigin="anonymous"></script> 

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="wrapper">
        <div class="flash-messages {% if get_flashed_messages(with_categories=True) %}show{% endif %}">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category if category else 'info' }}">
                      <span>{{ message }}</span>
                      <button type="button" class="close-flash" onclick="this.parentElement.style.display='none';" aria-label="Close">×</button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
        </div>

        
        <form class="login-form" action="{{ url_for('main.login') }}" method="POST">
            <h1>Login</h1>
            <div class="input-box">
                <input type="email" placeholder="Email" required name="email" autocomplete="email">
                <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" required name="password" autocomplete="current-password">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox" name="remember">Remember Me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="{{ url_for('main.index') }}">Register</a></p>
            </div>
        </form>
    </div>
</body>
</html>
